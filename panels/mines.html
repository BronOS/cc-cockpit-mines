<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mines</title>
    <!-- CSP: scripts only from this plugin's own files, so the code is in view.js (pure helpers) and mines.js. -->
    <script src="../__sdk/panel.js"></script>
    <link rel="stylesheet" href="mines.css" />
    <script src="view.js"></script>
    <script src="mines.js" defer></script>
  </head>
  <body>
    <div class="mines">
      <div class="bar">
        <select id="size" title="Board size" aria-label="Board size"></select>
        <span class="grow"></span>
        <button id="new" type="button" title="New game (N)">New</button>
      </div>
      <div class="bar">
        <span class="stat" title="Mines left">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="6" fill="currentColor" /><path d="M12 3v4M12 19v2M3 13h3M18 13h3M5.6 6.6l2.1 2.1M16.3 17.3l2.1 2.1M5.6 19.4l2.1-2.1M16.3 8.7l2.1-2.1" stroke="currentColor" stroke-width="2" /></svg>
          <span id="left">0</span>
        </span>
        <span class="stat" title="Time (seconds)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="2" /><path d="M12 9v4l3 2M9 2h6" stroke="currentColor" stroke-width="2" fill="none" /></svg>
          <span id="time">0</span>
        </span>
        <span class="grow"></span>
        <div class="mode" role="group" aria-label="What a click does" title="What a click does (right-click and F always flag)">
          <button id="mOpen" type="button" class="cc-chip" aria-pressed="true">Open</button>
          <button id="mFlag" type="button" class="cc-chip" aria-pressed="false">Flag</button>
        </div>
      </div>
      <div class="boardwrap">
        <div class="board" id="board" tabindex="0" aria-label="Board: arrows move, Space opens, F flags, N new game"></div>
        <div class="cc-empty" id="loading"><span class="cc-spinner"></span></div>
        <div class="cover" id="cover" hidden></div>
      </div>
      <div class="foot">
        <span>Best: <span id="best">—</span></span>
        <span>Right-click flags · click a number to open around it</span>
      </div>
    </div>
  </body>
</html>
